name: Notify Slack

on:
  workflow_call:
    inputs:
      site_url:
        description: Public site URL included in the success message
        required: true
        type: string
      job_status:
        description: Result of the job being reported (success, failure, cancelled)
        required: true
        type: string
      workflow_name:
        description: Caller workflow name shown in failure and cancelled messages
        required: false
        type: string
        default: ''
      channel:
        description: Slack channel to post to
        required: false
        type: string
        default: '#website-updates'
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Post to Slack
        env:
          JOB_STATUS: ${{ inputs.job_status }}
          SITE_URL: ${{ inputs.site_url }}
          CHANNEL: ${{ inputs.channel }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          workflow_name="${WORKFLOW_NAME:-$GITHUB_WORKFLOW}"
          branch="$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//_/g')"
          git_sha="$(git rev-parse HEAD)"
          git_sha_short="$(git rev-parse --short HEAD)"
          commit_message="$(git log --format=%B -n 1 "$git_sha")"
          site_label="${SITE_URL#https://}"
          site_label="${site_label#http://}"
          site_label="${site_label%/}"

          case "$JOB_STATUS" in
            success)
              color='good'
              text="Copying new content to server <${SITE_URL}|${site_label}>..."
              ;;
            cancelled)
              color='warning'
              text="${workflow_name} (${GITHUB_RUN_NUMBER}) build cancelled"
              ;;
            *)
              color='danger'
              text="${workflow_name} (${GITHUB_RUN_NUMBER}) build failed"
              ;;
          esac

          payload=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg color "$color" \
            --arg text "$text" \
            --arg message "$commit_message" \
            --arg actor "$ACTOR" \
            --arg sha "$git_sha" \
            --arg sha_short "$git_sha_short" \
            --arg repo "$REPO" \
            --arg branch "$branch" \
            '{
              channel: $channel,
              attachments: [{
                color: $color,
                text: $text,
                fields: [
                  {title: "Commit message", value: $message},
                  {title: "Committed by", value: "<https://github.com/\($repo)/commits?author=\($actor)|\($actor)>", short: true},
                  {title: "Commit SHA", value: "<https://github.com/\($repo)/commit/\($sha)|\($sha_short)>", short: true},
                  {title: "Repository", value: "<https://github.com/\($repo)|\($repo)>", short: true},
                  {title: "Branch", value: "<https://github.com/\($repo)/tree/\($branch)|\($branch)>", short: true}
                ]
              }]
            }')

          curl -sfS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
