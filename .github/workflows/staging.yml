name: Deploy Staging
on:
  push:
    branches:
      - "staging"
    paths-ignore:
      - '**README.md'
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET_STAGING }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_STAGING }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-hugo-sass

      - uses: ./.github/actions/build-hugo
        with:
          config: staging.toml

      - name: Deploy
        uses: reggionick/s3-deploy@v4
        with:
          folder: public
          bucket: ${{ secrets.S3_BUCKET_STAGING }}
          bucket-region: ${{ secrets.S3_BUCKET_REGION }}
          dist-id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_STAGING }}
          invalidation: /*
          delete-removed: true

      - name: Notify Slack
        if: always()
        uses: ./.github/actions/notify-slack
        with:
          site_url: https://staging.ror.org
          job_status: ${{ job.status }}
          workflow_name: ${{ github.workflow }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
