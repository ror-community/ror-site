name: Setup Hugo and Dart Sass
description: Install Dart Sass and Hugo with pinned versions

inputs:
  hugo_version:
    description: Hugo version to install
    required: false
    default: '0.165.0'
  dart_sass_version:
    description: Dart Sass version to install
    required: false
    default: '1.102.0'
  dart_sass_sha256:
    description: SHA256 checksum of the Dart Sass linux-x64 archive
    required: false
    default: '2a2ce6036f94534b39356252b1a3d4aa7879ab139c73bf62f7c9b5beafcfc367'

runs:
  using: composite
  steps:
    - name: Install Dart Sass
      env:
        GH_TOKEN: ${{ github.token }}
        DART_SASS_VERSION: ${{ inputs.dart_sass_version }}
        DART_SASS_SHA256: ${{ inputs.dart_sass_sha256 }}
      shell: bash
      run: |
        archive="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${archive}"
        echo "${DART_SASS_SHA256}  ${{ runner.temp }}/${archive}" | sha256sum -c -
        gh attestation verify "${{ runner.temp }}/${archive}" --owner sass
        tar -C "${HOME}/.local" -xf "${{ runner.temp }}/${archive}"
        echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3.2.1
      with:
        hugo-version: ${{ inputs.hugo_version }}
